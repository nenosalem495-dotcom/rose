<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You Heart</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* زرار "اضغط هنا يا حب" */
        #clickBtn {
            background: linear-gradient(135deg, #ff2a6d, #ff5e99);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(255, 42, 109, 0.6);
            transition: 0.3s ease;
            z-index: 10;
            margin-bottom: 20px;
        }

        #clickBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 42, 109, 0.9);
        }

        /* حاوية القلب المتكون من الكلام */
        #heartContainer {
            position: relative;
            width: 400px;
            height: 400px;
            display: none; /* مخفي لحد ما يضغط */
        }

        /* الكلمات المتناثرة على شكل قلب */
        .love-word {
            position: absolute;
            color: #ff2a6d;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.8);
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <button id="clickBtn" onclick="revealHeart()">❤️ اضغط هنا يا حب ❤️</button>
    
    <div id="heartContainer"></div>

    <script>
        function revealHeart() {
            // اخفاء الزرار بعد الضغط
            document.getElementById('clickBtn').style.display = 'none';
            
            const container = document.getElementById('heartContainer');
            container.style.display = 'block';

            // معادلة رسم القلب هندسياً باستخدام تكرار كلمة Love You
            // المعادلات الرياضية لرسم قلب باستخدام احداثيات (x, y)
            for (let t = 0; t < Math.PI * 2; t += 0.08) {
                // معادلة القلب الشهيرة
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                // تكبير وتوسيع الإحداثيات عشان تناسب الشاشة
                x = x * 15 + 200;
                y = y * 15 + 180;

                createWord(x, y);
            }

            // طبقات تانية داخلية عشان القلب يطلع مليان ومجسم زي الصورة بالضبط
            for (let scale = 0.7; scale > 0.2; scale -= 0.15) {
                for (let t = 0; t < Math.PI * 2; t += 0.12) {
                    let x = (16 * Math.pow(Math.sin(t), 3)) * scale;
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;

                    x = x * 15 + 200;
                    y = y * 15 + 180;

                    createWord(x, y);
                }
            }
        }

        function createWord(x, y) {
            const span = document.createElement('span');
            span.className = 'love-word';
            span.innerText = 'Love You';
            span.style.left = x + 'px';
            span.style.top = y + 'px';
            
            // تحويل عشوائي بسيط لزاوية الحروف عشان تدي شكل فني ديناميكي
            let rotation = (Math.random() - 0.5) * 30;
            span.style.transform = `rotate(${rotation}deg)`;

            document.getElementById('heartContainer').appendChild(span);
        }
    </script>

</body>
</html>
