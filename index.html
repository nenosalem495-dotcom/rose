<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAA</title>
    <style>
        body {
            background-color: #0b0b0b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* زر اضغط هنا نفس شكل الصورة */
        .btn {
            background: linear-gradient(135deg, #ff2a6d, #ff5e92);
            color: white;
            padding: 16px 40px;
            font-size: 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.6);
            font-weight: bold;
            z-index: 100;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .btn:hover {
            transform: scale(1.08);
        }
        /* حاوية القلب المصنوع من الكلمات */
        #love-heart {
            position: relative;
            width: 320px;
            height: 300px;
            display: none;
            transform: scale(0.8);
            animation: pulseHeart 1.5s infinite alternate;
        }
        /* تصميم القلب الحقيقي بال CSS والكلمات المتداخلة بداخله */
        .heart-shape {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #ff2a6d;
            transform: rotate(45deg);
            top: 40px;
            left: 60px;
            box-shadow: 0 0 40px #ff2a6d, 0 0 80px #ff2a6d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #ff2a6d;
            border-radius: 50%;
        }
        .heart-shape::before {
            top: -100px;
            left: 0;
        }
        .heart-shape::after {
            left: -100px;
            top: 0;
        }
        /* كلمات Love You المتكررة جوه القلب عشان تطابق الصورة */
        .love-text-bg {
            position: absolute;
            width: 350px;
            color: #ff8da1;
            font-size: 13px;
            font-weight: bold;
            line-height: 14px;
            text-align: center;
            transform: rotate(-45deg);
            z-index: 10;
            opacity: 0.85;
            text-shadow: 0 0 3px #ff2a6d;
        }
        /* اسم ROAA اللي هيظهر جوه القلب في الآخر والشاشة تتهز */
        #roaa-name {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            z-index: 20;
            display: none;
            text-shadow: 0 0 10px #000, 0 0 20px #ff2a6d, 0 0 30px #ff2a6d;
        }
        @keyframes pulseHeart {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.05); }
        }
        /* اهتزاز الشاشة */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(3px, 2px) rotate(0deg); }
            60% { transform: translate(-1px, -1px) rotate(1deg); }
            80% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-screen {
            animation: shake 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- زر البداية بنفس الستايل -->
    <button class="btn" id="startBtn" onclick="showLove()">❤️ اضغط هنا يا حب</button>

    <!-- شكل القلب وتكوينه -->
    <div id="love-heart">
        <div class="heart-shape"></div>
        <div class="love-text-bg">
            Love You Love You Love You Love You<br>
            Love You Love You Love You Love You<br>
            Love You Love You Love You Love You<br>
            Love You Love You Love You Love You<br>
            Love You Love You Love You Love You<br>
            Love You Love You Love You Love You<br>
            Love You Love You Love You Love You
        </div>
        <div id="roaa-name">ROAA ✨</div>
    </div>

    <script>
        function showLove() {
            // إخفاء الزرار
            document.getElementById('startBtn').style.display = 'none';
            
            // إظهار القلب
            const heart = document.getElementById('love-heart');
            heart.style.display = 'block';

            // اهتزاز الشاشة وإظهار اسم ROAA بعد جزء من الثانية
            setTimeout(() => {
                document.body.classList.add('shake-screen');
                document.getElementById('roaa-name').style.display = 'block';
            }, 300);
        }
    </script>
</body>
</html>
