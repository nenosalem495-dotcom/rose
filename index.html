<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAA</title>
    <style>
        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .btn {
            background-color: #ff2a6d;
            color: white;
            padding: 15px 35px;
            font-size: 22px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff2a6d;
            font-weight: bold;
            z-index: 100;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.1);
        }
        #heart-matrix {
            position: absolute;
            font-family: monospace;
            font-size: 14px;
            line-height: 12px;
            color: #ff2a6d;
            text-align: center;
            display: none;
            text-shadow: 0 0 8px #ff2a6d;
        }
        #roaa-text {
            position: absolute;
            color: white;
            font-size: 35px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ff2a6d, 0 0 25px #ff2a6d, 0 0 35px #ff2a6d;
            display: none;
            z-index: 50;
            text-align: center;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-screen {
            animation: shake 0.5s ease;
        }
    </style>
</head>
<body>

    <button class="btn" id="startBtn" onclick="startAnimation()">❤️ اضغط هنا</button>

    <div id="heart-matrix"></div>

    <div id="roaa-text">ROAA ✨</div>

    <script>
        function startAnimation() {
            document.getElementById('startBtn').style.display = 'none';
            
            const matrixDiv = document.getElementById('heart-matrix');
            matrixDiv.style.display = 'block';

            const heartShape = [
                "   1234567890123   ",
                " 12345678901234567 ",
                "1234567890123456789",
                "1234567890123456789",
                " 12345678901234567 ",
                "  123456789012345  ",
                "    12345678903    ",
                "      1234567      ",
                "        123        ",
                "         1         "
            ];

            let currentLines = [];
            let index = 0;

            let interval = setInterval(() => {
                if (index < heartShape.length) {
                    let randomizedLine = heartShape[index].replace(/[0-9]/g, () => Math.floor(Math.random() * 10));
                    currentLines.push(randomizedLine);
                    matrixDiv.innerHTML = currentLines.join("<br>");
                    index++;
                } else {
                    clearInterval(interval);
                    
                    document.body.classList.add('shake-screen');

                    setTimeout(() => {
                        document.getElementById('roaa-text').style.display = 'block';
                    }, 400);
                }
            }, 150);
        }
    </script>
</body>
</html>
