<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAA</title>
    <style>
        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* زر اضغط هنا نفس شكل الصورة بالضبط */
        .btn {
            background: linear-gradient(135deg, #ff2a6d, #ff5e92);
            color: white;
            padding: 16px 45px;
            font-size: 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.7);
            font-weight: bold;
            z-index: 100;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.08);
        }
        /* حاوية القلب المتداخل بالكلمات */
        #heart-container {
            position: relative;
            width: 300px;
            height: 280px;
            display: none;
            margin-top: 20px;
            transform: scale(0.9);
            animation: pulse 1.2s infinite alternate;
        }
        /* تكرار كلمات Love You بشكل مكثف وكبير لملء شكل القلب */
        .love-matrix {
            position: absolute;
            width: 100%;
            height: 100%;
            color: #ff2a6d;
            font-size: 11px;
            font-weight: bold;
            line-height: 12px;
            text-align: center;
            word-break: break-all;
            overflow: hidden;
            opacity: 0.9;
            text-shadow: 0 0 4px #ff2a6d;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        /* اسم ROAA اللي هيظهر جوه القلب في الآخر */
        #roaa-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 34px;
            font-weight: bold;
            z-index: 50;
            display: none;
            text-shadow: 0 0 10px #000, 0 0 20px #ff2a6d, 0 0 30px #ff2a6d;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.05); }
        }
        /* اهتزاز الشاشة */
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-4px, 0px) rotate(-1deg); }
            40% { transform: translate(4px, -2px) rotate(1deg); }
            60% { transform: translate(-2px, 2px) rotate(0deg); }
            80% { transform: translate(2px, -2px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-screen {
            animation: shake 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- زر البداية -->
    <button class="btn" id="startBtn" onclick="revealHeart()">❤️ اضغط هنا يا حب</button>

    <!-- شكل القلب والكلمات -->
    <div id="heart-container">
        <div class="love-matrix" id="matrixText"></div>
        <div id="roaa-name">ROAA ✨</div>
    </div>

    <script>
        function revealHeart() {
            // إخفاء الزر
            document.getElementById('startBtn').style.display = 'none';
            
            // توليد كلمات Love You متكررة بكثافة لملء الشاشة والقلب
            const textBlock = "Love You ".repeat(150);
            document.getElementById('matrixText').innerText = textBlock;

            // إظهار القلب
            document.getElementById('heart-container').style.display = 'block';

            // اهتزاز الشاشة وإظهار اسم ROAA
            setTimeout(() => {
                document.body.classList.add('shake-screen');
                document.getElementById('roaa-name').style.display = 'block';
            }, 350);
        }
    </script>
</body>
</html>
