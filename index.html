<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمي الغالية</title>
    <style>
        body {
            background-color: #0b0b0b;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .heart-container {
            position: relative;
            width: 250px;
            height: 250px;
            animation: heartbeat 1.2s infinite;
        }
        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ff2a6d;
            transform: rotate(45deg);
            box-shadow: 0 0 30px #ff2a6d, 0 0 60px #ff2a6d;
        }
        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background-color: #ff2a6d;
            border-radius: 50%;
        }
        .heart::before {
            top: -125px;
            left: 0;
        }
        .heart::after {
            left: -125px;
            top: 0;
        }
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }
        @keyframes heartbeat {
            0% { transform: scale(1) rotate(45deg); }
            15% { transform: scale(1.15) rotate(45deg); }
            30% { transform: scale(1) rotate(45deg); }
            45% { transform: scale(1.1) rotate(45deg); }
            60% { transform: scale(1) rotate(45deg); }
        }
    </style>
</head>
<body>
    <div class="heart-container">
        <div class="heart"></div>
        <div class="text-overlay">أمّي الغالية ❤️</div>
    </div>
</body>
</html>
